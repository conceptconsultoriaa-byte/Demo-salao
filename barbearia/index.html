:root{
  --ink:#141210;--ink2:#1e1b17;--ink3:#2a261f;
  --paper:#f2ede5;--card:#fbf8f3;--line:#ddd3c4;--muted:#7b7266;
  --brass:#b98a4b;--brassL:#d8b077;--red:#9a3326;
  --disp:"Disp","Oswald","Arial Narrow",sans-serif;
  --ital:"Ital","Lora",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
em{font-family:var(--ital);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0}
.demo-tag{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--ink);color:#a89d8c;font-size:9px;letter-spacing:.22em;text-align:center;padding:5px 0;text-transform:uppercase}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--brass)}
.h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1;letter-spacing:.01em}

function drawQR(){
  const c=$("#qr"); if(!c) return; const x=c.getContext("2d"); x.fillStyle="#fff";x.fillRect(0,0,29,29);x.fillStyle="#141210";
  let s=7; const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<29;i++)for(let j=0;j<29;j++) if(r()>.52) x.fillRect(i,j,1,1);
  [[0,0],[22,0],[0,22]].forEach(([a,b])=>{x.fillStyle="#fff";x.fillRect(a,b,7,7);x.fillStyle="#141210";x.fillRect(a,b,7,7);x.fillStyle="#fff";x.fillRect(a+1,b+1,5,5);x.fillStyle="#141210";x.fillRect(a+2,b+2,3,3);});
}

    <p class="lead" style="margin:8px 0 0;font-size:12px">Envie para ${nm}. O link vale por 7 dias e só pode ser usado uma vez.</p>
    <div class="lnk"><input readonly value="https://suabarbearia.app/convite/8F3K2"><button class="btn dark">Copiar</button></div>
    <button class="btn ghost" style="width:100%;margin-top:10px;height:38px;font-size:9.5px">Enviar por WhatsApp</button>
    <button class="btn ghost" style="width:100%;margin-top:8px;height:38px;font-size:9.5px" onclick="S.panel=2;S.modal=null;render()">Abrir como convidado</button></div></div>`;
  }
  const tabs=[["agenda","Agenda"],["servicos","Serviços"],["galeria","Galeria"],["equipe","Equipe"],["resultados","Resultados"]];
  return `<div class="pn"><div class="pn-b">${b}</div><div class="tabs">${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="S.tab='${t[0]}';S.modal=null;render()">${t[1]}</button>`).join("")}<button onclick="closeAll()">Sair</button></div></div>${m}`;
}
function invite(){
  const nm=S.invName||"Mateus Prado";
  return `<div class="pn"><div class="inv-top"><div class="stripes"></div><div class="brand">${BRAND}</div><h2>Faça parte<em>da equipe.</em></h2></div>
  <div class="pn-b" style="padding-top:22px"><div class="eyebrow">Convite da Dom Navalha</div><h2 class="h2" style="font-size:28px;margin-top:6px">Você foi convidado como <em>barbeiro.</em></h2>
  <p class="lead" style="margin-top:8px">Crie o seu acesso em um minuto. Quem enviou o convite não vê os seus dados de login.</p>
  <div class="fld"><label>Nome completo</label><input value="${nm}"></div>
  <div class="fld"><label>WhatsApp</label><input value="(21) 97766-5544"></div>
  <div class="fld"><label>O que você atende</label><div class="chips">${SVC.map((s,i)=>`<button class="chip ${[0,1,3].includes(i)?"sel":""}" onclick="this.classList.toggle('sel')">${s.n}</button>`).join("")}</div></div>
  <button class="btn dark" style="width:100%;margin-top:22px" onclick="S.panel=1;S.tab='equipe';render()">Criar meu acesso</button></div></div>`;
}

function render(){
  let h="";
  if(S.panel===1) h=panel(); else if(S.panel===2) h=invite(); else if(S.step) h=book();
  $("#layer").innerHTML=h; document.body.style.overflow=h?"hidden":""; drawQR();
}
site(); render();

/* gancho para gravar o vídeo */
window.demo=(o)=>{Object.assign(S,o);render();};
</script>
</body>
